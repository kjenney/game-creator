<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game Creator</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <main id="app">
    <header>
      <h1>Game Creator</h1>
      <p class="tagline">Pick a game, make it yours, take it with you — no account, no server.</p>
    </header>

    <section id="templates-section">
      <h2>Choose a template</h2>
      <div id="template-list" class="template-list"></div>
    </section>

    <section id="form-section" hidden>
      <h2 id="form-heading">Customize</h2>
      <div id="form"></div>
    </section>

    <section id="summary-section" hidden>
      <h2 id="summary-heading">Before you export</h2>
      <div id="summary"></div>
    </section>

    <section id="export-section">
      <button id="export-btn" disabled>Export my game…</button>
      <p id="export-status" role="status"></p>
    </section>
  </main>
  <script type="module" src="/src/creator/main.js"></script>
</body>
</html>
