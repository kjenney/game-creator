# GitHub Pages — build the mkdocs documentation site (docs/) and deploy it.
# Runs on push to main, on pull requests (build check), and on demand.
# Deploys only from main; the deploy job requires the `github-pages`
# environment (Settings → Pages → Source: GitHub Actions).
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# only one Pages deploy in flight at a time; don't cancel a running deploy
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/pages-requirements.txt
      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/workflows/pages-requirements.txt
          mkdocs --version
      - name: Build the site (strict — warnings fail the build)
        run: mkdocs build --strict
        env:
          GITHUB_PAGENAME: ${{ github.repository }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
